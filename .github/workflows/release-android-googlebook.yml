name: Release — Android & Googlebook OS (Kotlin M3E + Vulkan JNI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "28.0.13004108"
  ANDROID_COMPILE_SDK: "36"

jobs:
  build-android-googlebook:
    name: Android & Googlebook APK / AAB (arm64-v8a & x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 & JDK 21 (AGP / Kotlin JVM Toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Android SDK & NDK (${{ env.ANDROID_NDK_VERSION }})
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;35.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Export ANDROID_NDK_HOME
        run: |
          NDK_PATH="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain (aarch64-linux-android & x86_64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo registry and Android NDK artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk-arm64-x86_64

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          cargo ndk --version

      - name: Compile libvexio_core.so / libvexio_jni.so for arm64-v8a & x86_64
        run: |
          JNI_OUT="apps/android-googlebook/app/src/main/jniLibs"
          rm -rf "${JNI_OUT}"
          cargo ndk \
            --platform 29 \
            -t arm64-v8a \
            -t x86_64 \
            -o "${JNI_OUT}" \
            build --release -p vexio-core

          for ABI in arm64-v8a x86_64; do
            test -f "${JNI_OUT}/${ABI}/libvexio_core.so"
            cp -f "${JNI_OUT}/${ABI}/libvexio_core.so" "${JNI_OUT}/${ABI}/libvexio_jni.so"
            ls -lh "${JNI_OUT}/${ABI}/"
          done

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision Persistent Release Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            KS_PATH="${RUNNER_TEMP}/vexio-release.p12"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KS_PATH}"
            chmod 600 "${KS_PATH}"
            echo "ANDROID_KEYSTORE_PATH=${KS_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Run Gradle Unit Tests, assembleRelease & bundleRelease
        working-directory: apps/android-googlebook
        env:
          SKIP_CARGO_NDK: "1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify APK v1/v2/v3 Signature & Clean Ephemeral Keystore
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/vexio-release.p12"
          APK_SRC=$(ls apps/android-googlebook/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          if [ -n "${APK_SRC}" ]; then
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${APK_SRC}"
          fi

      - name: Stage Version-Named Android & Googlebook APK / AAB Installers
        run: |
          VERSION_TAG="${GITHUB_REF_NAME:-dev}"
          OUT_DIR="apps/android-googlebook/app/build/outputs/release-named"
          mkdir -p "${OUT_DIR}"
          APK_SRC=$(ls apps/android-googlebook/app/build/outputs/apk/release/*.apk | head -n 1)
          AAB_SRC=$(ls apps/android-googlebook/app/build/outputs/bundle/release/*.aab | head -n 1)
          cp -f "${APK_SRC}" "${OUT_DIR}/Vexio-Android-Googlebook-${VERSION_TAG}.apk"
          cp -f "${AAB_SRC}" "${OUT_DIR}/Vexio-Android-Googlebook-${VERSION_TAG}.aab"
          ls -lh "${OUT_DIR}/"

      - name: Upload Android & Googlebook Release APK / AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexio-android-googlebook-release
          path: apps/android-googlebook/app/build/outputs/release-named/*
          if-no-files-found: error

      - name: Publish APK / AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apps/android-googlebook/app/build/outputs/release-named/*
