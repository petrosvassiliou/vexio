name: Release — macOS Universal2 DMG (Swift 6 Liquid Glass + Metal)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  build-macos-dmg:
    name: macOS 15 Universal2 App, Quick Look & DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+ (Swift 6 toolchain & macOS 15 SDK)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          swift --version
          xcodebuild -version

      - name: Install Rust stable toolchain (aarch64-apple-darwin & x86_64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and Darwin artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal2

      - name: Build vexio-core for Apple Silicon & Intel
        run: |
          cargo build --release -p vexio-core --target aarch64-apple-darwin
          cargo build --release -p vexio-core --target x86_64-apple-darwin

      - name: Merge Universal2 libvexio_core.a via lipo
        run: |
          mkdir -p target/universal/release
          lipo -create \
            -output target/universal/release/libvexio_core.a \
            target/aarch64-apple-darwin/release/libvexio_core.a \
            target/x86_64-apple-darwin/release/libvexio_core.a
          lipo -info target/universal/release/libvexio_core.a

          # Ensure SwiftPM linker resolves static Universal2 archive without dylib shadowing
          cp -f target/universal/release/libvexio_core.a target/release-static-libvexio_core.a

      - name: Build Swift 6 VexioMacApp (Liquid Glass + Metal) & VexioQuickLookExtension
        working-directory: apps/macos
        run: |
          swift build -c release --arch arm64 --product VexioMacApp
          swift build -c release --arch x86_64 --product VexioMacApp
          swift build -c release --arch arm64 --product VexioQuickLookExtension
          swift build -c release --arch x86_64 --product VexioQuickLookExtension

      - name: Assemble Vexio.app Bundle, Embed Quick Look Extension & Package DMG
        run: |
          STAGE_DIR="apps/macos/build/dmg-stage"
          APP_BUNDLE="${STAGE_DIR}/Vexio.app"
          QL_APPEX="${APP_BUNDLE}/Contents/PlugIns/VexioQuickLookExtension.appex"
          ARM_BIN_DIR=$(swift build --package-path apps/macos -c release --arch arm64 --show-bin-path)
          X64_BIN_DIR=$(swift build --package-path apps/macos -c release --arch x86_64 --show-bin-path)

          rm -rf "apps/macos/build"
          mkdir -p \
            "${APP_BUNDLE}/Contents/MacOS" \
            "${APP_BUNDLE}/Contents/Resources/Stencils" \
            "${QL_APPEX}/Contents/MacOS"

          lipo -create \
            -output "${APP_BUNDLE}/Contents/MacOS/VexioMacApp" \
            "${ARM_BIN_DIR}/VexioMacApp" \
            "${X64_BIN_DIR}/VexioMacApp"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/VexioMacApp"
          cp -f "apps/macos/Info.plist" "${APP_BUNDLE}/Contents/Info.plist"
          cp -f stencils/*.vssx "${APP_BUNDLE}/Contents/Resources/Stencils/"

          # Embed Universal2 VexioQuickLookExtension (.vsdx, .vssx, .vstx, .vsd offline previews)
          lipo -create \
            -output "${QL_APPEX}/Contents/MacOS/VexioQuickLookExtension" \
            "${ARM_BIN_DIR}/libVexioQuickLookExtension.dylib" \
            "${X64_BIN_DIR}/libVexioQuickLookExtension.dylib"
          chmod +x "${QL_APPEX}/Contents/MacOS/VexioQuickLookExtension"
          if [ -f "apps/macos/Sources/VexioQuickLookExtension/Info.plist" ]; then
            cp -f "apps/macos/Sources/VexioQuickLookExtension/Info.plist" "${QL_APPEX}/Contents/Info.plist"
          fi

          lipo -info "${APP_BUNDLE}/Contents/MacOS/VexioMacApp"
          lipo -info "${QL_APPEX}/Contents/MacOS/VexioQuickLookExtension"
          codesign --force --deep --sign - "${APP_BUNDLE}"

          ln -s /Applications "${STAGE_DIR}/Applications"
          VERSION_TAG="${GITHUB_REF_NAME:-dev}"
          DMG_PATH="apps/macos/build/Vexio-${VERSION_TAG}-Universal2.dmg"
          hdiutil create \
            -volname "Vexio" \
            -srcfolder "${STAGE_DIR}" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          ls -lh "${DMG_PATH}"

      - name: Upload macOS Universal2 DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexio-macos-universal2-dmg
          path: apps/macos/build/*.dmg
          if-no-files-found: error

      - name: Publish DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apps/macos/build/*.dmg
