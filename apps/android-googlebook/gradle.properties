org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# Target ABIs for ARM64 Googlebook / Android tablets and x86_64 Intel/AMD Googlebook workstations
vexio.ndk.abis=arm64-v8a,x86_64
vexio.rust.workspaceDir=../../
