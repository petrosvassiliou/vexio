[workspace]
resolver = "2"
members = [
    "crates/vexio-shapesheet",
    "crates/vexio-vsdx",
    "crates/vexio-vsd-legacy",
    "crates/vexio-cad",
    "crates/vexio-render",
    "crates/vexio-core",
]

[workspace.package]
version = "0.4.3-alpha"
edition = "2021"
license = "LicenseRef-Vexio-Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
quick-xml = "0.37"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
cfb = "0.10"
rstar = "0.12"
lyon_path = "1.0"
lyon_tessellation = "1.0"
bytemuck = { version = "1.20", features = ["derive"] }
wgpu = { version = "24.0", features = ["webgl"] }
pollster = "0.4"
base64 = "0.22"
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ttf-parser = "0.25"
jni = { version = "0.21", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "WorkerGlobalScope",
    "Performance",
    "OffscreenCanvas",
] }

vexio-shapesheet = { path = "crates/vexio-shapesheet" }
vexio-vsdx = { path = "crates/vexio-vsdx" }
vexio-vsd-legacy = { path = "crates/vexio-vsd-legacy" }
vexio-cad = { path = "crates/vexio-cad" }
vexio-render = { path = "crates/vexio-render" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
